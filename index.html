<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Energy Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; background: #f4f4f9; padding: 20px; }
        h1 { color: #333; text-align: center; }
        .form-group { margin-bottom: 15px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { padding: 8px; margin: 5px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #4CAF50; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
    </style>
</head>
<body>
    <h1>⚡ Household Energy Simulator</h1>
    <form action="/simulation" method="POST">
        <div class="form-group">
            <h3>Appliance 1 (e.g., Fridge)</h3>
            <label>Power (Watts): <input type="number" name="puissance_1" value="200" required></label>
            <label>Hours/Day: <input type="number" name="heures_1" value="24" required></label>
        </div>
        <div class="form-group">
            <h3>Appliance 2 (e.g., AC)</h3>
            <label>Power (Watts): <input type="number" name="puissance_2" value="1500" required></label>
            <label>Hours/Day: <input type="number" name="heures_2" value="8" required></label>
        </div>
        <div class="form-group">
            <h3>Electricity Price</h3>
            <label>Price per kWh: <input type="number" step="0.01" name="prix" value="1.20" required></label>
        </div>
        <button type="submit">Simulate Consumption</button>
    </form>
</body>
</html>
